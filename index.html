<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1Win Penalty Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>⚽ 1Win Penalty Kick Game</h1>
        
        <div class="game-info">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="attempts">Attempts: <span id="attempts">0</span>/5</div>
        </div>

        <div class="game-board">
            <div class="goal">
                <div id="goalGrid" class="goal-grid">
                    <!-- 3 rows x 5 columns grid will be generated by JavaScript -->
                </div>
                <div id="ball" class="ball"></div>
            </div>
        </div>

        <div class="controls">
            <h3>Click on a square to shoot the ball there!</h3>
            <button id="resetBtn" class="btn">New Game</button>
        </div>

        <div class="results" id="results"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
